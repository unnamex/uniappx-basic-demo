<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAD Viewer Launcher</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f3f4f6;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      color: #6b7280;
    }
  </style>
</head>

<body>
  <div class="loading">加载 CAD 图纸中，请稍候...</div>
  <script>
    (async function () {
      try {
        function getParam(name) {
          const urlParams = new URLSearchParams(window.location.search);
          let val = urlParams.get(name);
          if (!val) {
            let hashStr = window.location.hash;
            if (hashStr) {
              hashStr = hashStr.substring(1);
              if (hashStr.startsWith('?')) hashStr = hashStr.substring(1);
              const hashParams = new URLSearchParams(hashStr);
              val = hashParams.get(name);
            }
          }
          return val;
        }

        const fileUrl = getParam('file');
        if (!fileUrl) {
          document.body.innerHTML = '<div class="loading">未提供 CAD 文件源</div>';
          return;
        }

        // 抓取 HTML 内容
        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error('网络响应异常');
        let htmlContent = await response.text();

        // ========== 注入 resize 自适应脚本 ==========
        // 该脚本在 CAD 页面加载完毕后，监听 window resize 事件，
        // 自动查找所有 <canvas> 元素并重设其尺寸，同时尝试触发
        // 主流 3D 引擎（HOOPS / Three.js / 通用 WebGL）的 resize 回调。
        const resizeScript = `
<script>
(function() {
  var resizeTimer = null;

  function doResize() {
    var w = window.innerWidth;
    var h = window.innerHeight;

    // 1. 重设所有 canvas 元素的像素尺寸
    var canvases = document.querySelectorAll('canvas');
    for (var i = 0; i < canvases.length; i++) {
      var c = canvases[i];
      // 仅调整那些几乎占满容器的主 canvas（跳过小图标 canvas）
      if (c.width > 100 && c.height > 100) {
        c.width = w;
        c.height = h;
        c.style.width = w + 'px';
        c.style.height = h + 'px';
      }
    }

    // 2. 尝试调用 HOOPS Communicator 的 resize
    if (typeof hwv !== 'undefined' && hwv && typeof hwv.resizeCanvas === 'function') {
      try { hwv.resizeCanvas(); } catch(e) {}
    }

    // 3. 尝试调用 Three.js 全局 renderer 的 resize
    if (typeof renderer !== 'undefined' && renderer && typeof renderer.setSize === 'function') {
      try {
        renderer.setSize(w, h);
        if (typeof camera !== 'undefined' && camera) {
          camera.aspect = w / h;
          if (typeof camera.updateProjectionMatrix === 'function') {
            camera.updateProjectionMatrix();
          }
        }
      } catch(e) {}
    }

    // 4. 尝试触发全局的 onResize / onWindowResize 回调
    if (typeof onResize === 'function') { try { onResize(); } catch(e) {} }
    if (typeof onWindowResize === 'function') { try { onWindowResize(); } catch(e) {} }
    if (typeof handleResize === 'function') { try { handleResize(); } catch(e) {} }
  }

  // 防抖：拖拽期间 100ms 内只触发一次
  window.addEventListener('resize', function() {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(doResize, 100);
  });

  // 页面加载后延迟触发一次初始 resize，确保 canvas 匹配实际容器尺寸
  setTimeout(doResize, 500);
  setTimeout(doResize, 1500);
})();
<\\/script>`;

        // 将 resize 脚本注入到 </body> 之前
        if (htmlContent.indexOf('</body>') !== -1) {
          htmlContent = htmlContent.replace('</body>', resizeScript + '\n</body>');
        } else {
          // 如果没有 </body> 标签，追加到末尾
          htmlContent += resizeScript;
        }

        // 完全重写当前文档
        document.open();
        document.write(htmlContent);
        document.close();
      } catch (err) {
        console.error('CAD 文件加载失败:', err);
        document.body.innerHTML = '<div class="loading" style="color:#ef4444">CAD 文件加载失败: ' + err.message + '</div>';
      }
    })();
  </script>
</body>

</html>
