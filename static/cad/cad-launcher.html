<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAD Viewer Launcher</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f3f4f6;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      color: #6b7280;
    }
  </style>
</head>

<body>
  <div class="loading">加载 CAD 图纸中，请稍候...</div>
  <script>
    (async function () {
      try {
        function getParam(name) {
          const urlParams = new URLSearchParams(window.location.search);
          let val = urlParams.get(name);
          if (!val) {
            let hashStr = window.location.hash;
            if (hashStr) {
              hashStr = hashStr.substring(1);
              if (hashStr.startsWith('?')) hashStr = hashStr.substring(1);
              const hashParams = new URLSearchParams(hashStr);
              val = hashParams.get(name);
            }
          }
          return val;
        }

        const fileUrl = getParam('file');
        if (!fileUrl) {
          document.body.innerHTML = '<div class="loading">未提供 CAD 文件源</div>';
          return;
        }

        // 抓取 HTML 内容
        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error('网络响应异常');
        let htmlContent = await response.text();

        // ========== 注入优化后的 resize 自适应脚本 ==========
        const resizeScript = `
<script>
(function() {
  function doResize() {
    var w = window.innerWidth;
    var h = window.innerHeight;

    var canvases = document.querySelectorAll('canvas');
    for (var i = 0; i < canvases.length; i++) {
      var c = canvases[i];
      if (c.width > 100 && c.height > 100) {
        c.width = w;
        c.height = h;
        c.style.width = w + 'px';
        c.style.height = h + 'px';
      }
    }

    if (typeof hwv !== 'undefined' && hwv && typeof hwv.resizeCanvas === 'function') {
      try { hwv.resizeCanvas(); } catch(e) {}
    }

    if (typeof renderer !== 'undefined' && renderer && typeof renderer.setSize === 'function') {
      try {
        renderer.setSize(w, h);
        if (typeof camera !== 'undefined' && camera) {
          camera.aspect = w / h;
          if (typeof camera.updateProjectionMatrix === 'function') {
            camera.updateProjectionMatrix();
          }
        }
      } catch(e) {}
    }

    if (typeof onResize === 'function') { try { onResize(); } catch(e) {} }
    if (typeof onWindowResize === 'function') { try { onWindowResize(); } catch(e) {} }
    if (typeof handleResize === 'function') { try { handleResize(); } catch(e) {} }
  }

  // 使用 ResizeObserver 搭配 requestAnimationFrame 提升性能，避免卡顿
  var observer = new ResizeObserver(function() {
    window.requestAnimationFrame(doResize);
  });
  
  if (document.body) {
    observer.observe(document.body);
  } else {
    document.addEventListener('DOMContentLoaded', function() {
      if(document.body) observer.observe(document.body);
    });
  }

  // 通知父容器隐藏 loading
  try {
    var parentLoading = window.parent.document.querySelector('.loading');
    if (parentLoading) {
      parentLoading.style.display = 'none';
    }
  } catch(e) {}
})();
<\/script>`;

        if (htmlContent.indexOf('</body>') !== -1) {
          htmlContent = htmlContent.replace('</body>', resizeScript + '\n</body>');
        } else {
          htmlContent += resizeScript;
        }

        // 使用 iframe 替代 HTML 文档的直接覆盖 (document.write) 避免阻塞主线程
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const blobUrl = URL.createObjectURL(blob);

        const iframe = document.createElement('iframe');
        iframe.style.cssText = 'width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0;';
        iframe.src = blobUrl;

        iframe.onload = function () {
          const loading = document.querySelector('.loading');
          if (loading) loading.style.display = 'none';
          URL.revokeObjectURL(blobUrl);
        };

        document.body.appendChild(iframe);
      } catch (err) {
        console.error('CAD 文件加载失败:', err);
        document.body.innerHTML = '<div class="loading" style="color:#ef4444">CAD 文件加载失败: ' + err.message + '</div>';
      }
    })();
  </script>
</body>

</html>
