<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAD Viewer Launcher</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f3f4f6;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      width: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      color: #6b7280;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 9999;
      background-color: #f3f4f6;
    }
  </style>
</head>

<body>
  <div class="loading">加载中，请稍候...</div>
  <script>
    /**
     * 沙盒兼容脚本：注入到 CAD HTML 的 <head> 中，在引擎代码执行前优先运行。
     * 解决 HarmonyOS WebView / Blob 环境下的三大安全限制：
     * 1. localStorage / sessionStorage 访问被拒 (SecurityError)
     * 2. IndexedDB 访问被拒 (SecurityError)
     * 3. new URL() 因协议不合法而抛出 TypeError
     * 4. /pdm/ 无效 API 请求拦截
     */
    function buildSandboxShimScript() {
      return '<sc' + 'ript>\n' +
        '(function() {\n' +
        '  // 1. Mock localStorage / sessionStorage\n' +
        '  window._mockStorage = (function() {\n' +
        '    var store = {};\n' +
        '    return {\n' +
        '      getItem: function(k) { return store[k] || null; },\n' +
        '      setItem: function(k, v) { store[k] = String(v); },\n' +
        '      removeItem: function(k) { delete store[k]; },\n' +
        '      clear: function() { store = {}; },\n' +
        '      key: function(i) { return Object.keys(store)[i] || null; },\n' +
        '      get length() { return Object.keys(store).length; }\n' +
        '    };\n' +
        '  })();\n' +
        '\n' +
        '  // 2. IndexedDB 拦截\n' +
        '  if (window.IDBFactory && IDBFactory.prototype && IDBFactory.prototype.open) {\n' +
        '    var origIdbOpen = IDBFactory.prototype.open;\n' +
        '    IDBFactory.prototype.open = function() {\n' +
        '      try {\n' +
        '        return origIdbOpen.apply(this, arguments);\n' +
        '      } catch(e) {\n' +
        '        console.warn("Sandbox: IndexedDB blocked", e);\n' +
        '        var req = {};\n' +
        '        setTimeout(function() {\n' +
        '          if (typeof req.onerror === "function") {\n' +
        '            req.error = new Error("IndexedDB blocked");\n' +
        '            req.onerror({ target: req });\n' +
        '          }\n' +
        '        }, 10);\n' +
        '        return req;\n' +
        '      }\n' +
        '    };\n' +
        '  }\n' +
        '\n' +
        '  // 3. URL 构造容错\n' +
        '  var OrigURL = window.URL;\n' +
        '  if (typeof OrigURL === "function") {\n' +
        '    window.URL = function(url, base) {\n' +
        '      try {\n' +
        '        return base ? new OrigURL(url, base) : new OrigURL(url);\n' +
        '      } catch(e) {\n' +
        '        console.warn("Sandbox: Invalid URL intercepted:", url);\n' +
        '        return new OrigURL("http://127.0.0.1:1/dummy");\n' +
        '      }\n' +
        '    };\n' +
        '    window.URL.createObjectURL = OrigURL.createObjectURL;\n' +
        '    window.URL.revokeObjectURL = OrigURL.revokeObjectURL;\n' +
        '  }\n' +
        '\n' +
        '  // 4. /pdm/ 无效 API 拦截\n' +
        '  var origOpen = window.XMLHttpRequest.prototype.open;\n  window.XMLHttpRequest.prototype.open = function(method, url) {\n    if (typeof url === "string" && url.indexOf("/pdm/") !== -1) {\n      url = "http://127.0.0.1:1/offline_block";\n    } else if (typeof url === "string" && url.indexOf("/fonts/") !== -1 && (url.indexOf(".ttf") !== -1 || url.indexOf(".woff") !== -1)) {\n      var parts = url.split("/");\n      arguments[1] = "../ranuts-document/fonts/" + parts[parts.length-1];\n    }\n    return origOpen.apply(this, arguments);\n  };\n  var origFetch = window.fetch;\n  if (origFetch) {\n    window.fetch = function() {\n      var url = arguments[0];\n      if (typeof url === "string" && url.indexOf("/pdm/") !== -1) {\n        return Promise.reject(new TypeError("Failed to fetch"));\n      } else if (typeof url === "string" && url.indexOf("/fonts/") !== -1 && (url.indexOf(".ttf") !== -1 || url.indexOf(".woff") !== -1)) {\n        var parts = url.split("/");\n        arguments[0] = "../ranuts-document/fonts/" + parts[parts.length-1];\n      }\n      return origFetch.apply(this, arguments);\n    };\n  }\n' +
        '})();\n' +
        '</' + 'script>';
    }

    function renderCadHtml(htmlContent) {
      // 构建沙盒兼容脚本
      var shimScript = buildSandboxShimScript();

      // 计算 baseUrl
      var headInsert = '<style>html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }</style>\n' + shimScript;

      // 注入到 <head> 最前面，确保沙盒脚本先于引擎代码执行
      if (htmlContent.indexOf('<head>') !== -1) {
        htmlContent = htmlContent.replace('<head>', '<head>\n  ' + headInsert);
      } else {
        htmlContent = headInsert + '\n' + htmlContent;
      }

      // 全局替换 localStorage / sessionStorage 为 mock 对象
      htmlContent = htmlContent.replace(/\blocalStorage\b/g, 'window._mockStorage');
      htmlContent = htmlContent.replace(/\bsessionStorage\b/g, 'window._mockStorage');

      // 为了避免 Blob 环境下的沙盒安全限制（如 WebWorker / IndexedDB 跨域拦截），
      // 使用 document.write 将内容直接写入同源 iframe。
      var existingIframe = document.querySelector('iframe');
      if (existingIframe) {
        document.body.removeChild(existingIframe);
      }

      var iframe = document.createElement('iframe');
      iframe.style.cssText = 'width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0;';
      document.body.appendChild(iframe);

      var doc = iframe.contentWindow.document;
      doc.open();
      
      doc.write(htmlContent);
      doc.close();

      var loading = document.querySelector('.loading');
      if (loading) {
        var checkReady = setInterval(function() {
          if (doc.querySelector('canvas')) {
            clearInterval(checkReady);
            loading.style.display = 'none';
          }
        }, 100);

        // 最长等待 15 秒后强制隐藏 loading
        setTimeout(function() {
          clearInterval(checkReady);
          loading.style.display = 'none';
        }, 15000);
      }
    }

    // ========== 方式一：通过 URL 参数 fetch 加载（WEB 端使用） ==========
    (async function () {
      try {
        function getParam(name) {
          var urlParams = new URLSearchParams(window.location.search);
          var val = urlParams.get(name);
          if (!val) {
            var hashStr = window.location.hash;
            if (hashStr) {
              hashStr = hashStr.substring(1);
              if (hashStr.startsWith('?')) hashStr = hashStr.substring(1);
              var hashParams = new URLSearchParams(hashStr);
              val = hashParams.get(name);
            }
          }
          return val;
        }

        var fileUrl = getParam('file');
        if (!fileUrl) {
          // 没有 file 参数时，等待原生端通过 evalJS 注入内容
          return;
        }

        // 抓取 HTML 内容
        var response = await fetch(fileUrl);
        if (!response.ok) throw new Error('网络响应异常');
        var htmlContent = await response.text();

        renderCadHtml(htmlContent);
      } catch (err) {
        console.error('图纸加载失败:', err);
        document.body.innerHTML = '<div class="loading" style="color:#ef4444">图纸加载失败: ' + err.message + '</div>';
      }
    })();

    // ========== 方式二：原生端通过 evalJS 注入 Base64 内容（APP 端使用） ==========
    /**
     * 接收 Base64 编码的 CAD HTML，解码后渲染
     * @param {string} base64Str - Base64 编码的 HTML 内容
     */
    window.loadCadFromBase64 = function (base64Str) {
      try {
        // 解码 Base64 -> 二进制 -> UTF-8 文本
        var binaryStr = atob(base64Str);
        var bytes = new Uint8Array(binaryStr.length);
        for (var i = 0; i < binaryStr.length; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }
        var htmlContent = new TextDecoder('utf-8').decode(bytes);
        renderCadHtml(htmlContent);
      } catch (err) {
        console.error('Base64 解码失败:', err);
        document.body.innerHTML = '<div class="loading" style="color:#ef4444">图纸加载失败: ' + err.message + '</div>';
      }
    };
  </script>
</body>

</html>
